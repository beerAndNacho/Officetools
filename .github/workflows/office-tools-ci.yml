name: OfficeTools CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/office-tools-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'docs/**'
      - 'package.json'
      - '.github/workflows/office-tools-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog and source
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Verify 100 independent routes
        run: |
          test -s dist/index.html
          test -s dist/assets/catalog.js
          test -s dist/assets/portal.js
          test -s dist/assets/engine.js
          test -s dist/assets/styles.css
          test "$(find dist/tools -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')" -eq 100
          test -s dist/tools/percentage-calculator/index.html
          test -s dist/tools/meeting-minutes/index.html
          test -s dist/tools/csv-to-json/index.html
          test -s dist/tools/uptime-sla/index.html
