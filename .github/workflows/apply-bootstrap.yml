name: Restore OfficeTools source

on:
  push:
    branches: [main, restore-office-tools]
    paths:
      - '.github/workflows/apply-bootstrap.yml'
      - '.restore-v2/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-officetools-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct verified source archive
        run: |
          set -euo pipefail
          echo 'Restoring OfficeTools source archive v2.'
          test "$(find .restore-v2 -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" -eq 10
          cat .restore-v2/part-* | tr -d '\r\n ' | base64 --decode > /tmp/officetools-source.tar.gz
          echo '1ee3be63b11d3a44449cd20d014a1c867c57ae7d8cd83e5bfe96cccf7e41b1cc  /tmp/officetools-source.tar.gz' | sha256sum -c -
          mkdir -p /tmp/officetools-source
          tar -xzf /tmp/officetools-source.tar.gz -C /tmp/officetools-source
          test -s /tmp/officetools-source/package.json
          test -s /tmp/officetools-source/src/catalog.js
          test -s /tmp/officetools-source/src/engine.js
          test -s /tmp/officetools-source/src/portal.js
          test -s /tmp/officetools-source/src/styles.css
          rsync -a /tmp/officetools-source/ ./

      - name: Validate 100 tools and build
        run: |
          set -euo pipefail
          npm run check
          npm run build
          test -s dist/index.html
          test -s dist/assets/catalog.js
          test -s dist/assets/engine.js
          test -s dist/assets/portal.js
          test -s dist/assets/styles.css
          tool_count="$(find dist/tools -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')"
          test "$tool_count" -eq 100
          test -s dist/tools/percentage-calculator/index.html
          test -s dist/tools/meeting-minutes/index.html
          test -s dist/tools/csv-to-json/index.html
          test -s dist/tools/uptime-sla/index.html
          echo "Validated $tool_count independent office tool routes."

      - name: Commit restored source
        run: |
          rm -rf dist .bootstrap .bootstrap-xz .restore-v2
          rm -f .github/workflows/apply-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'feat: add 100 browser-based office tools'
          git push
